<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Aurora Sleep Screening account password.">
  <title>Reset Password — Aurora Sleep Disorder Screening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .reset-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - var(--header-h));
      padding: 24px;
      margin-top: var(--header-h);
      position: relative;
      z-index: 1;
    }

    .reset-card {
      width: 100%;
      max-width: 460px;
      padding: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .reset-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .reset-logo {
      height: 48px;
      object-fit: contain;
    }

    .reset-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .reset-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .reset-header p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .alert-box {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }

    .alert-danger {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
    }

    .pass-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pass-wrap input {
      width: 100%;
      padding-right: 42px;
    }

    .btn-toggle-pass {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>

  <header class="app-header" id="appHeader">
    <div class="header-inner">
      <div class="header-left">
        <img src="logo.png" alt="Aurora Sleep Screening Logo" class="header-logo">
      </div>
      <div class="header-center">
        <span class="header-title">Aurora Portal</span>
      </div>
      <div class="header-right" style="display:flex;align-items:center;">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon" id="themeIcon"><i class="bi bi-moon-fill"></i></span>
        </button>
      </div>
    </div>
  </header>

  <main class="reset-container">
    <div class="reset-card">
      <div class="reset-logo-wrap">
        <img src="logo.png" alt="Aurora Sleep Screening" class="reset-logo">
      </div>

      <div class="reset-header">
        <h2>Set New Password</h2>
        <p id="userGreeting">Create a secure new password for your account.</p>
      </div>

      <div id="alertBox" class="alert-box">
        <i id="alertIcon" class="bi"></i>
        <span id="alertMessage"></span>
      </div>

      <form id="resetForm" autocomplete="off">
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="newPassword">New Password <span class="req">*</span></label>
          <div class="pass-wrap">
            <input type="password" id="newPassword" class="input" placeholder="Minimum 6 characters" required minlength="6" autofocus>
            <button type="button" class="btn-toggle-pass" id="toggleNewPass">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="confirmPassword">Confirm New Password <span class="req">*</span></label>
          <div class="pass-wrap">
            <input type="password" id="confirmPassword" class="input" placeholder="Re-enter your new password" required minlength="6">
            <button type="button" class="btn-toggle-pass" id="toggleConfirmPass">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmitReset" class="btn btn-primary btn-lg" style="width: 100%;">
          Update Password & Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="login.html" style="font-size: 0.85rem; color: var(--accent); text-decoration: none;">
          &larr; Back to Log In
        </a>
      </div>
    </div>
  </main>

  <script src="reset-password.js"></script>
</body>

</html>
