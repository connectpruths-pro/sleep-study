<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Patient clinical summary — Sleep disorder screening results and indicators.">
    <title>Patient Clinical Summary — Aurora Sleep Disorder Screening</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Diagnostic Dashboard Grid Layout */
        .clinical-dashboard-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 28px;
            margin-top: 24px;
        }

        @media (max-width: 1024px) {
            .clinical-dashboard-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* Diagnostic Card Components */
        .clinical-section-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .clinical-section-card:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(129, 140, 248, 0.4);
        }

        .clinical-section-title-new {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-card);
            padding-bottom: 10px;
        }

        /* Risk Finder Banner Glow Styles */
        .clinical-finding-banner {
            padding: 20px 24px;
            border-radius: var(--radius-sm);
            border-left: 5px solid transparent;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: var(--transition);
        }

        .clinical-finding-banner--high {
            background: rgba(220, 38, 38, 0.08);
            border-color: var(--danger);
            border-left-color: var(--danger);
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.1);
        }

        .clinical-finding-banner--moderate {
            background: rgba(217, 119, 6, 0.08);
            border-color: var(--warning);
            border-left-color: var(--warning);
            box-shadow: 0 4px 20px rgba(217, 119, 6, 0.1);
        }

        .clinical-finding-banner--low {
            background: rgba(22, 163, 74, 0.08);
            border-color: var(--success);
            border-left-color: var(--success);
            box-shadow: 0 4px 20px rgba(22, 163, 74, 0.1);
        }

        /* Radar Chart Wrapper */
        .chart-box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 280px;
            width: 100%;
            margin-top: 10px;
        }

        /* Pill Badge for indicators */
        .indicator-pill {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .indicator-pill--alert {
            background: rgba(244, 63, 94, 0.15);
            color: #f43f5e;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        /* Responsive layout for Identity */
        .clinical-meta-list {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .clinical-meta-item-new {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes dropdownFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <header class="app-header" id="appHeader">
        <div class="header-inner">
            <div class="header-left">
                <img src="logo.png" alt="Aurora Sleep Disorder Screening Logo" class="header-logo">
            </div>
            <div class="header-center">
                <span class="header-title">Patient Clinical Summary</span>
            </div>
            <div class="header-right" style="display:flex;align-items:center;gap:12px;">
                <div class="profile-dropdown-wrapper" style="position: relative; display: inline-flex;">
                    <span id="userDisplay" style="cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;"></span>
                    <div id="profileDropdown" style="display: none; position: absolute; top: calc(100% + 12px); right: 0; width: 340px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 20px; z-index: 1001; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); animation: dropdownFadeIn 0.2s ease forwards;">
                        <!-- Dynamically populated by JS -->
                    </div>
                </div>
                <a href="dashboard.html" class="clinical-back-link" id="btnBack">← Dashboard</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="theme-icon" id="themeIcon"><i class="bi bi-moon-fill"></i></span>
                </button>
                <button id="btnLogout" class="btn btn-secondary btn-sm" style="padding: 6px 12px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <article class="clinical-container" id="patientContent">
            <!-- Rendered by patient.js -->
        </article>
    </main>

    <script src="patient.js"></script>
</body>

</html>
